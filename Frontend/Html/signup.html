<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إنشاء حساب جديد</title>
    <link rel="stylesheet" href="../Css/signup.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="background-effect">
      <div class="background-circle circle-1"></div>
      <div class="background-circle circle-2"></div>
    </div>

    <div class="container">
      <h1>إنشاء حساب جديد</h1>

      <form id="signup-form" autocomplete="on">
        <div class="form-group-inline">
          <div class="form-group">
            <label for="firstName">الاسم الأول</label>
            <input
              type="text"
              id="firstName"
              name="firstName"
              placeholder="أدخل الاسم الأول"
              required
              autocomplete="given-name"
            />
          </div>
          <div class="form-group">
            <label for="lastName">اسم العائلة</label>
            <input
              type="text"
              id="lastName"
              name="lastName"
              placeholder="أدخل اسم العائلة"
              required
              autocomplete="family-name"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="أدخل بريدك الإلكتروني"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="username">اسم المستخدم</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="أدخل اسم المستخدم المفضل"
            required
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="أدخل كلمة المرور"
            required
            autocomplete="new-password"
          />
          <span
            class="password-toggle"
            id="password-toggle"
            aria-label="إظهار/إخفاء كلمة المرور"
            role="button"
            tabindex="0"
          >
            <i class="far fa-eye" id="password-icon" aria-hidden="true"></i>
          </span>
          <div class="password-strength">
            <div class="password-strength-meter" id="password-meter"></div>
          </div>
          <span class="password-strength-text" id="password-strength-text">قوة كلمة المرور</span>
        </div>

        <div class="form-group">
          <label for="confirm-password">تأكيد كلمة المرور</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="أعد إدخال كلمة المرور"
            required
            autocomplete="new-password"
          />
          <span
            class="password-toggle"
            id="confirm-password-toggle"
            aria-label="إظهار/إخفاء تأكيد كلمة المرور"
            role="button"
            tabindex="0"
          >
            <i class="far fa-eye" id="confirm-password-icon" aria-hidden="true"></i>
          </span>
        </div>

        <label class="checkbox-container">
          <input type="checkbox" id="terms" name="terms" required />
          <span class="checkmark"></span>
          <span class="checkbox-label">أوافق على <a href="#" style="color: #09c609;">الشروط والأحكام</a> و <a href="#" style="color: #09c609;">سياسة الخصوصية</a></span>
        </label>

        <label class="checkbox-container">
          <input type="checkbox" id="newsletter" name="newsletter" />
          <span class="checkmark"></span>
          <span class="checkbox-label">أرغب في تلقي الأخبار والعروض عبر البريد الإلكتروني</span>
        </label>

        <button
          type="submit"
          class="btn btn-signup"
          id="signup-button"
          aria-label="إنشاء حساب"
        >
          <i class="fas fa-user-plus icon" aria-hidden="true"></i>
          <span class="btn-text">إنشاء حساب</span>
          <div class="btn-loader"></div>
        </button>
      </form>

      <div class="option-divider">
        <span class="option-divider-text">أو</span>
      </div>

      <button
        class="btn btn-google"
        id="google-signup"
        aria-label="التسجيل بواسطة Google"
      >
        <i class="fab fa-google icon" aria-hidden="true"></i>
        <span class="btn-text">التسجيل بواسطة Google</span>
        <div class="btn-loader"></div>
      </button>

      <button
        class="btn btn-discord"
        id="discord-signup"
        aria-label="التسجيل بواسطة Discord"
      >
        <i class="fab fa-discord icon" aria-hidden="true"></i>
        <span class="btn-text">التسجيل بواسطة Discord</span>
        <div class="btn-loader"></div>
      </button>

      <div class="login-link">
        لديك حساب بالفعل؟ <a href="login.html" id="login-link">تسجيل الدخول</a>
      </div>
    </div>

    <script src="../Script/signup.js"></script>
  </body>
</html>
